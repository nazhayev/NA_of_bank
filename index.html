<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P2P Pro — Доступ | Нажаев Ахмад</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

  :root {
    --bg: #05080f;
    --bg-card: #0d1117;
    --bg-input: #161b22;
    --border: #21262d;
    --text: #e6edf3;
    --text-2: #8b949e;
    --text-3: #6e7681;
    --accent: #58a6ff;
    --green: #3fb950;
    --red: #f85149;
    --gradient: linear-gradient(135deg, #58a6ff, #bc8cff);
    --shadow: 0 8px 24px rgba(0,0,0,0.4);
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .container {
    width: 100%;
    max-width: 440px;
  }

  .brand {
    text-align: center;
    margin-bottom: 28px;
  }

  .brand-name {
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 4px;
  }

  .brand-tag {
    font-size: 0.85rem;
    color: var(--text-2);
  }

  .brand-line {
    width: 40px;
    height: 2px;
    background: var(--gradient);
    border-radius: 2px;
    margin: 12px auto 0;
  }

  .product-head {
    text-align: center;
    margin-bottom: 24px;
  }

  .product-head h1 {
    font-size: 1.5rem;
    font-weight: 800;
    background: var(--gradient);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 6px;
  }

  .product-head p {
    color: var(--text-2);
    font-size: 0.9rem;
  }

  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px;
    box-shadow: var(--shadow);
  }

  .card-title {
    font-size: 1.05rem;
    font-weight: 600;
    margin-bottom: 20px;
    text-align: center;
  }

  .input-wrap {
    position: relative;
    margin-bottom: 16px;
  }

  .code-input {
    width: 100%;
    padding: 14px 16px;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    font-size: 1.3rem;
    font-family: 'JetBrains Mono', monospace;
    text-align: center;
    letter-spacing: 4px;
    outline: none;
    transition: all 0.3s;
  }

  .code-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.15);
  }

  .code-input.error {
    border-color: var(--red);
    animation: shake 0.4s ease;
  }

  .code-input.success {
    border-color: var(--green);
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-6px); }
    40%, 80% { transform: translateX(6px); }
  }

  .btn {
    width: 100%;
    padding: 14px;
    background: var(--gradient);
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    transition: all 0.3s;
  }

  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(88, 166, 255, 0.3);
  }

  .btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
  }

  .message {
    text-align: center;
    padding: 12px;
    border-radius: 10px;
    font-size: 0.9rem;
    margin-top: 16px;
    display: none;
  }

  .message.error {
    display: block;
    background: rgba(248, 81, 73, 0.1);
    border: 1px solid rgba(248, 81, 73, 0.2);
    color: var(--red);
  }

  .message.success {
    display: block;
    background: rgba(63, 185, 80, 0.1);
    border: 1px solid rgba(63, 185, 80, 0.2);
    color: var(--green);
  }

  .hint {
    text-align: center;
    color: var(--text-3);
    font-size: 0.8rem;
    margin-top: 16px;
  }

  .buy-link {
    text-align: center;
    margin-top: 20px;
  }

  .buy-link a {
    color: var(--accent);
    text-decoration: none;
    font-size: 0.9rem;
    font-weight: 500;
  }

  .success-screen {
    display: none;
    text-align: center;
  }

  .success-screen.active {
    display: block;
  }

  .success-icon {
    width: 80px;
    height: 80px;
    background: rgba(63, 185, 80, 0.15);
    border: 2px solid var(--green);
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    margin-bottom: 20px;
  }

  .success-screen h2 {
    font-size: 1.3rem;
    margin-bottom: 8px;
  }

  .success-screen p {
    color: var(--text-2);
    margin-bottom: 24px;
  }

  .access-btn {
    display: inline-block;
    padding: 14px 32px;
    background: var(--gradient);
    color: white;
    text-decoration: none;
    border-radius: 12px;
    font-weight: 600;
    transition: all 0.3s;
  }

  .footer {
    text-align: center;
    margin-top: 24px;
    color: var(--text-3);
    font-size: 0.75rem;
  }

  .footer-brand {
    font-weight: 600;
    color: var(--text-2);
  }
</style>
</head>
<body>

<div class="container">

  <div class="brand">
    <div class="brand-name">Нажаев Ахмад</div>
    <div class="brand-tag">P2P Арбитражник & Ментор</div>
    <div class="brand-line"></div>
  </div>

  <div class="product-head">
    <h1>P2P Pro</h1>
    <p>Калькулятор и схема прогрева карт</p>
  </div>

  <div class="card" id="loginCard">
    <div class="card-title">Введите код доступа</div>

    <div class="input-wrap">
      <input 
        type="text" 
        class="code-input" 
        id="codeInput"
        placeholder="00000000000"
        maxlength="11"
        inputmode="numeric"
        autocomplete="off"
      >
    </div>

    <button class="btn" id="verifyBtn" onclick="verifyCode()">
      Открыть калькулятор
    </button>

    <div class="message" id="message"></div>

    <div class="hint">
      Пример: 12345678901
    </div>

    <div class="buy-link">
      <a href="#buy" onclick="showBuyInfo()">Как получить код доступа?</a>
    </div>
  </div>

  <div class="card success-screen" id="successScreen">
    <div class="success-icon">✓</div>
    <h2>Доступ подтверждён</h2>
    <p>Код активирован. Нажмите ниже, чтобы открыть калькулятор.</p>
    <a href="calculator.html" class="access-btn">Открыть калькулятор</a>
  </div>

  <div class="footer">
    © 2026 <span class="footer-brand">Нажаев Ахмад</span>. Все права защищены.
  </div>

</div>

<script>
const codeInput = document.getElementById('codeInput');

codeInput.addEventListener('input', function(e) {
  // Только цифры
  e.target.value = e.target.value.replace(/\D/g, '');
  e.target.classList.remove('error');
  document.getElementById('message').className = 'message';
});

codeInput.addEventListener('keypress', function(e) {
  if (e.key === 'Enter') verifyCode();
});

const VALID_CODE = '88305869644';

function verifyCode() {
  const btn = document.getElementById('verifyBtn');
  const input = document.getElementById('codeInput');
  const msg = document.getElementById('message');
  const code = input.value.trim();

  if (!code) {
    showError('Введите код доступа');
    return;
  }

  if (code.length !== 11) {
    showError('Код должен содержать ровно 11 цифр');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Проверка...';

  setTimeout(() => {
    btn.disabled = false;
    btn.textContent = 'Открыть калькулятор';

    if (code === VALID_CODE) {
      input.classList.add('success');
      showSuccess('Код подтверждён!');
      localStorage.setItem('p2p_access_granted', code);
      localStorage.setItem('p2p_access_time', Date.now());
      setTimeout(() => {
        document.getElementById('loginCard').style.display = 'none';
        document.getElementById('successScreen').classList.add('active');
      }, 800);
    } else {
      input.classList.add('error');
      showError('Неверный код доступа');
    }
  }, 600);
}

function showError(text) {
  const msg = document.getElementById('message');
  msg.textContent = text;
  msg.className = 'message error';
}

function showSuccess(text) {
  const msg = document.getElementById('message');
  msg.textContent = text;
  msg.className = 'message success';
}

function showBuyInfo() {
  alert('Для получения кода доступа свяжитесь в Telegram: @nazhayev\n\nСтоимость: 4 900 ₽');
}

window.addEventListener('load', () => {
  const granted = localStorage.getItem('p2p_access_granted');
  const time = localStorage.getItem('p2p_access_time');

  if (granted && time) {
    const hoursPassed = (Date.now() - parseInt(time)) / (1000 * 60 * 60);
    if (hoursPassed < 24 * 30) {
      document.getElementById('loginCard').style.display = 'none';
      document.getElementById('successScreen').classList.add('active');
    } else {
      localStorage.removeItem('p2p_access_granted');
      localStorage.removeItem('p2p_access_time');
    }
  }
});
</script>

</body>
</html>
